name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  rust-backend:
    name: Rust Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cd engine && cargo fmt --check

      - name: Clippy
        run: cd engine && cargo clippy -- -D warnings

      - name: Tests
        run: cd engine && cargo test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture guard
        run: npm run check:arch

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  tauri-build:
    name: Tauri Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, rust-backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm run tauri:install

      - name: Build Tauri app
        run: npm run tauri:build -- --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build
          path: |
            src-tauri/target/release/bundle/
          retention-days: 7

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Contract tests (informative)
        run: npm run test -- tests/integration/contracts.test.ts
        continue-on-error: true

      - name: E2E checklist (informative)
        run: echo "Run E2E manually: see tests/e2e/checklist.md"

  # ──────────────────────────────────────────
  # Stage timing (informative, no gate)
  # ──────────────────────────────────────────
  performance-baseline:
    name: Performance Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (informative)
        run: |
          echo "Benchmark scaffolding in tests/benchmarks/"
          echo "Run locally: cargo bench --package engine"
          echo "Targets: file_discovery, graph_build_50_nodes"
        continue-on-error: true

  # ──────────────────────────────────────────
  # Scan timing metrics in CI
  # ──────────────────────────────────────────
  scan-timing-report:
    name: Scan Timing Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Unit test timing
        run: |
          echo "=== Scan timing metrics ==="
          echo "scan_project.discover_ms: measured in Rust commands"
          echo "scan_project.parse_ms: measured in Rust commands"  
          echo "scan_project.total_ms: sum of above"
          echo "get_graph.build_ms: measured in get_graph command"
          echo ""
          echo "To enable actual timing capture, run:"
          echo "  cargo test -- --nocapture 2>&1 | grep ms"
        continue-on-error: false
