[package]
name = "engine"
version = "0.1.0-alpha"
edition = "2021"
authors = ["CodeAtlas Team"]
license = "MIT OR Apache-2.0"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine-cli"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.43", features = ["rt-multi-thread"] }

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# File system
walkdir = "2.5"
ignore = "0.4"

# Tree-sitter
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"

# HTTP client for AI
reqwest = { version = "0.12", features = ["json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.14"
